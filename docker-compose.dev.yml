services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    volumes:
      - data_mount_dev:/maskterial/data
    environment:
      - ENV=development
      # SMTP settings for password recovery emails
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    command: bash -c "python -m uvicorn server:app --host 0.0.0.0 --port 8000"

  nginx:
    image: public.ecr.aws/docker/library/nginx:1.27.2-alpine
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - build_mount_dev:/usr/share/nginx/html
      - ./etc/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      frontend_builder:
        condition: service_completed_successfully
      backend:
        condition: service_started

  frontend_builder:
    environment:
      - VITE_AVAILABLE_MODELS_URL=http://127.0.0.1:8001/api/available_models
      - VITE_INFERENCE_URL=http://127.0.0.1:8001/api/predict
      - VITE_DOWNLOAD_MODEL_URL=http://127.0.0.1:8001/api/download_model
      - VITE_GMM_UPLOAD_URL=http://127.0.0.1:8001/api/upload/gmm
      - VITE_AMM_UPLOAD_URL=http://127.0.0.1:8001/api/upload/amm
      - VITE_M2F_UPLOAD_URL=http://127.0.0.1:8001/api/upload/m2f
      - VITE_DELETE_MODEL_URL=http://127.0.0.1:8001/api/delete_model
      - VITE_M2F_TRAIN_URL=http://127.0.0.1:8001/api/train/m2f
      # Auth endpoints for dev
      - VITE_AUTH_REGISTER_URL=http://127.0.0.1:8001/api/auth/register
      - VITE_AUTH_LOGIN_URL=http://127.0.0.1:8001/api/auth/login
      - VITE_AUTH_FORGOT_URL=http://127.0.0.1:8001/api/auth/forgot-password
    build:
      context: ./maskterial-train-frontend
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - build_mount_dev:/app/dist
    command: "npm run build"

volumes:
  data_mount_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data_dev
  build_mount_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./maskterial-train-frontend/dist


